original_statement: "(3) \\textit{Dummy axiom}. If a variable {\\small $i\\in\\mathcal{N}$}\
  \ is a dummy variable, \\emph{i.e.} \n{\\small $\\forall \\mathcal{S}\\subseteq\
  \ \\mathcal{N}\\backslash\\{i\\}, v(\\boldsymbol{x}_{\\mathcal{S}\\cup\\{i\\}})=v(\\\
  boldsymbol{x}_{\\mathcal{S}})+v(\\boldsymbol{x}_{\\{i\\}})$}, it has no causal effect\
  \ with other variables, {\\small $\\forall \\mathcal{S}\\subseteq \\mathcal{N}\\\
  backslash\\{i\\}, w_{\\mathcal{S}\\cup\\{i\\}}=0$}."
problem: 文字说“with other variables”，可能暗指至少另有一个变量；但显示公式 ∀ S⊆N\{i}, w_(S∪{i})=0 没有限制
  S≠∅。在 S=∅ 时，一变量取值满足原显示前提，却不满足显示结论。这里记录为原意范围歧义，不判断作者究竟采用哪种隐含范围。
